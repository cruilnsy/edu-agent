# frontend/nginx.conf
# Serves the built app and forwards /api to the backend container.

server {
    listen 80;
    root /usr/share/nginx/html;

    client_max_body_size 21m;            # Resume PDFs are limited to 20 MB by the backend

    location /api/ {
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;       # Replaced, not appended: a client cannot spoof it
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;             # Streamed chat replies (SSE) must reach the browser as they arrive
        proxy_read_timeout 300s;         # A resume review takes up to a minute
    }

    location / {
        try_files $uri $uri/ /index.html;    # Client-side routes
    }
}
